name: release

# Single release pipeline: dispatch cuts a version (bump + tag), then the
# build matrix runs directly off the new tag. Manual `v*` tag pushes also
# build. Kept as ONE workflow because tag pushes made with GITHUB_TOKEN do
# not trigger other workflows (GitHub anti-recursion rule), so a separate
# tag-triggered build workflow would never fire for CI-cut releases.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump version, commit and tag
        id: version
        working-directory: packages/desktop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Explicit bump/commit/tag — npm version's built-in git flow is
          # unreliable here (workspace + detached checkout: exits 0 while
          # creating neither commit nor tag).
          npm version "${{ inputs.bump }}" --no-git-tag-version
          VERSION="v$(node -p "require('./package.json').version")"
          git add package.json
          git commit -m "chore(release): $VERSION"
          git tag -a "$VERSION" -m "$VERSION"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      # checkout@v4 leaves HEAD detached: push HEAD and the tag explicitly.
      - name: Push commit and tag
        run: |
          git push origin HEAD:refs/heads/"${{ github.ref_name }}"
          git push origin "refs/tags/${{ steps.version.outputs.tag }}"

  prepare-release:
    # GitHub allows MULTIPLE releases per tag. When the build matrix jobs
    # publish concurrently, two electron-builder publishers can race
    # release creation and strand each job's assets on a DIFFERENT release
    # object for the same tag (happened on v1.2.0 and v1.2.2 — assets went
    # missing from the tag-resolved release). Create the published release
    # exactly once BEFORE the matrix starts so builders only ever attach.
    if: always() && (needs.bump.result == 'success' || needs.bump.result == 'skipped')
    needs: bump
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.bump.outputs.tag || github.ref_name }}"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "${TAG#v}" --verify-tag --notes ""

  build:
    needs: [bump, prepare-release]
    # Dispatch path: bump succeeded, build its tag. Manual tag push path:
    # bump was skipped, build github.ref directly.
    if: always() && !failure() && !cancelled() && (needs.bump.result == 'success' || needs.bump.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            targets: --mac
          - os: windows-latest
            targets: --win
          - os: ubuntu-latest
            targets: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm via corepack (pinned by packageManager field)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop bundle
        run: pnpm --filter @kanbots/desktop run build

      - name: Package and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @kanbots/desktop exec electron-builder ${{ matrix.targets }} --publish always

      - name: Upload packaging output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-output-${{ matrix.os }}
          path: packages/desktop/release/
          retention-days: 14
          if-no-files-found: ignore
